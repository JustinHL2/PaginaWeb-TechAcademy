    <main class = "contenedor">
            <h1>Registrate a uno de nuestros cursos</h1><!--h1-h6-->
        <p>Registra tus datos para iniciar</p>

        <!--FORM-->
       <form action="#" method="GET"> <!--GET POST-->
        <label for="nombre">Nombre Completo: </label>
        <input type="text" id="nombre" placeholder="Ingresa nombre" name="nombre" required> 

        <label for="correo">Correo de notificacion:</label>
        <input type="email" id="correo" placeholder="Ingresa tu correo" name="correo" required>

        <label for="numero">Número de telefono</label>
        <input type="tel" id="numero" placeholder="Ingresa tu numero de telefono" name="num" required>

        <label for="curso">Curso que te gustaria tomar</label>
        <select name="curso" id="curso" required>
            <option value="ciberseguridad">Fundamentos de ciberseguridad</option>
            <option value="IA_generativa">Introducción a la IA generativa</option>
            <option value="soporte_técnico">Fundamentos de soporte técnico</option>
            <option value="Datos">Fundamentos: Datos, datos en todas partes</option>
        </select>
        <label for="mensaje">¿Qué esperas aprender del curso?</label>
        <textarea name="mensaje" id="mensaje" rows="5" required></textarea>
        <button type="submit">
            Registrar
        </button>

       </form>
    </main>
